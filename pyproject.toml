[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "haetae-scan"
version = "0.5.0"
description = "haetae (해태): a security checklist for your repository"
readme = "README.md"
license = "MIT"
authors = [{ name = "Joshua Lee" }]
requires-python = ">=3.10"
dependencies = []
classifiers = [
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]

[project.scripts]
haetae = "haetae.cli:main"

[tool.setuptools]
packages = ["haetae", "haetae.checks"]
